name: Sync sqlmap to Gitee

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream and push to Gitee
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/sqlmapproject/sqlmap.git
          git fetch upstream master

          git checkout master
          git merge upstream/master --no-edit || git merge upstream/master --no-edit -X ours

          git remote add gitee https://ksaliang:${{ secrets.GITEE_TOKEN }}@gitee.com/ksaliang/sqlmap.git
          git push gitee master --force
